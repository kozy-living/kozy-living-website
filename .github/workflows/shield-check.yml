name: Shield check

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "cloudflare/**"
      - "scripts/**"
      - "wrangler.jsonc"
      - ".github/workflows/shield-check.yml"

permissions:
  contents: read

concurrency:
  group: shield-check-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Configuration complete
        run: npm run protection:config
      - name: Edge rules in place
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_SHIELD_CHECK_TOKEN }}
        # Missing credentials fail the check; never silently skip protection.
        run: npm run shield:check
      - run: npx playwright install --with-deps chromium
      - name: Store and shield work
        run: npm run protection:live
